    <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>展开页面</title>

    <style>

        /* 整个页面 */
        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* 按钮所在区域 */
        .button-box {
            margin-top: 30px;
        }

        /* 按钮 */
        button {
            font-size: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background-color: #4da2e7;
            color: white;
            cursor: pointer;
        }

        /* 鼠标放上去 */
        button:hover {
            background-color: #085099;
        }

        /* 默认隐藏的内容 */
        #content {
            display: none;
            margin-top: 30px;
        }

    </style>
</head>


<body>

    <!-- 中间的按钮 -->
    <div class="button-box">

        <button onclick="openPage()">
            🚀 展开lovetime~
        </button>

    </div>


    <!-- 点击后出现的内容 -->
    <div id="content">

        <h1>🎉 love记事本 🎉</h1>

        <p>这里是展开之后的页面内容。</p>

        <p>你可以在这里添加图片、文字、按钮等内容。</p>

    </div>


    <script>

        // 点击按钮后执行
        function openPage() {

            // 找到 content
            let content = document.getElementById("content");

            // 显示内容
            content.style.display = "block";
        }

    </script>

</body>
